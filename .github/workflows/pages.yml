# The real site is https://avoimetportit.com (Cloudflare Pages).
# GitHub Pages (kevinsunde.github.io/avoimetportit) only holds redirect pages that forward there,
# so Google shows the real website instead of the GitHub copy.
name: Deploy GitHub Pages (redirects)

on:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build redirect pages
        run: node scripts/gh-pages-redirect.mjs

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-redirect
